name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint and Larastan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, bcmath, intl, gd
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Check code style
        run: composer lint

      - name: Static analysis
        run: composer analyse

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    # Same engines as local development, so CI exercises real Postgres locking.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: eu_inv_api_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d eu_inv_api_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    # Real environment variables take precedence over .env, which points at
    # the Compose service names.
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: app
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, bcmath, intl, gd
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: vendor/bin/pest

      # Scramble reads column types from the database, so this runs here and
      # not in the quality job. Once is enough.
      - name: Check openapi.json is up to date
        if: matrix.php == '8.4'
        env:
          DB_DATABASE: eu_inv_api_test
        run: |
          php artisan migrate --force
          php artisan scramble:export
          git diff --exit-code openapi.json || { echo "::error::openapi.json is out of date. Run php artisan scramble:export and commit the result."; exit 1; }
