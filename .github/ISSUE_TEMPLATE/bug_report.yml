name: Bug report
description: Something behaves differently from the docs or the spec.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The request you sent and the response you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Starting from `php artisan migrate --seed` is ideal.
  - type: input
    id: version
    attributes:
      label: Version or commit
